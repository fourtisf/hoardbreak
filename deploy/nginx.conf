# THE DRAGON JOB — nginx reverse proxy.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/thedragonjob
#   sudo ln -sfn /etc/nginx/sites-available/thedragonjob /etc/nginx/sites-enabled/thedragonjob
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let certbot rewrite this file with the TLS bits:
#   sudo certbot --nginx -d thedragonjob.com -d www.thedragonjob.com

server {
    listen 80;
    listen [::]:80;
    server_name thedragonjob.com www.thedragonjob.com;

    # Next's own hashed assets are immutable — let the browser keep them.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Brand art and anything else served straight off disk.
    location /brand/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    # The daily board. A separate process on 3100 so a board that falls over
    # takes the leaderboard with it and nothing else — the game itself does not
    # need this to be up, and is written not to wait on it.
    location /api/ {
        proxy_pass http://127.0.0.1:3100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # the board rate-limits per address, and reads this to find one
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        # a score is a few hundred bytes; nothing legitimate is larger
        client_max_body_size 8k;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    client_max_body_size 4m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
